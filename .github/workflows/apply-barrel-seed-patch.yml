name: Apply barrel seed registration patch

on:
  push:
    branches:
      - agent/fluffy-barrel-hover-names
    paths:
      - .github/workflows/apply-barrel-seed-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/fluffy-barrel-hover-names

      - name: Keep one seed item in Fluffy Barrels
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/main/java/io/ncbpfluffybear/fluffymachines/items/Barrel.java")
          text = path.read_text()
          old = '''            } else if (stored != 0) {   // Output remaining

                ItemStack clone = new CustomItemStack(Utils.unKeyItem(displayItem), stored);
                if (inv.fits(clone, OUTPUT_SLOTS)) {
                    setStored(b, 0);
                    inv.pushItem(clone, OUTPUT_SLOTS);
                    updateMenu(b, inv, false, capacity);
                }
            }
'''
          new = '''            } else if (stored > 1) {   // Output remaining, but keep one seed item registered

                int amount = stored - 1;
                ItemStack clone = new CustomItemStack(Utils.unKeyItem(displayItem), amount);
                if (inv.fits(clone, OUTPUT_SLOTS)) {
                    setStored(b, 1);
                    inv.pushItem(clone, OUTPUT_SLOTS);
                    updateMenu(b, inv, false, capacity);
                }
            }
'''
          if new in text:
              print("Seed-item behavior is already applied.")
          elif old in text:
              path.write_text(text.replace(old, new, 1))
              print("Applied seed-item behavior.")
          else:
              raise SystemExit("Expected pushOutput block was not found; refusing to modify the file.")

      - name: Commit source change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/main/java/io/ncbpfluffybear/fluffymachines/items/Barrel.java; then
            echo "No source change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/io/ncbpfluffybear/fluffymachines/items/Barrel.java
          git commit -m "Register Fluffy Barrels with one seed item"
          git push origin HEAD:agent/fluffy-barrel-hover-names
