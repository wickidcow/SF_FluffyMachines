name: Build FluffyMachines Legacy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a NEW immutable version from current master after all checks'
        type: boolean
        default: false
      release_version:
        description: 'Exact numeric version in this source; existing tags/releases are rejected'
        type: string
        default: ''

permissions:
  contents: read

env:
  LEGACY_ARTIFACT_VERSION: "26.2.16"
  OUTPUT_NAME: "SF_FluffyMachines26.2.16.jar"

concurrency:
  group: fluffy-machines-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      jar_sha256: ${{ steps.stage.outputs.jar_sha256 }}
    steps:
      - name: Checkout FluffyMachines
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify immutable publication and raw artifact rejection tests
        run: python3 -m unittest scripts.test_immutable_release_guard -v
      - name: Checkout Slimefun Legacy
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: .deps/Slimefun-Legacy
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Publish Slimefun Legacy API locally
        working-directory: .deps/Slimefun-Legacy
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=ALBION-SNAPSHOT --no-daemon
      - name: Verify compatibility metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<version>26.2.16</version>' pom.xml
          grep -Fq '<maven.compiler.release>21</maven.compiler.release>' pom.xml
          grep -Fq '<paper.version>1.21.11-R0.1-SNAPSHOT</paper.version>' pom.xml
          grep -Fq '<finalName>SF_FluffyMachines${project.version}</finalName>' pom.xml
          grep -Fq "api-version: '1.21.11'" src/main/resources/plugin.yml
      - name: Verify Doctor migration safety contract
        run: python3 scripts/verify_doctor_migration.py .
      - name: Verify Paper 1.21.11 compile baseline
        run: >-
          mvn -B clean verify --file pom.xml
          -Dpaper.version=1.21.11-R0.1-SNAPSHOT
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version=ALBION-SNAPSHOT
      - name: Verify Paper 26.2 compile compatibility
        run: >-
          mvn -B clean verify --file pom.xml
          -Dpaper.version=26.2.build.132-stable
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version=ALBION-SNAPSHOT
      - name: Verify Paper 26.3 stable compile compatibility
        run: >-
          mvn -B clean verify --file pom.xml
          -Dpaper.version=26.3.build.176-stable
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version=ALBION-SNAPSHOT
      - name: Build release JAR from 1.21.11 baseline
        run: >-
          mvn -B clean package --file pom.xml
          -Dpaper.version=1.21.11-R0.1-SNAPSHOT
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version=ALBION-SNAPSHOT
      - name: Prepare pinned native backpack regression inputs
        run: python3 scripts/runtime/prepare_backpack_probe_inputs.py --out .native-inputs
      - name: Verify native backpack transfers and restart persistence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          inputs = json.loads(Path('.native-inputs/inputs.json').read_text())
          if inputs.get('result') != 'PASS' or set(inputs['paper']) != {'1.21.11', '26.2', '26.3'}:
              raise SystemExit('All three verified native runtime inputs are required')
          for version in ('1.21.11', '26.2', '26.3'):
              subprocess.run([
                  'python3', 'scripts/runtime/run_backpack_transfer_probe.py',
                  '--paper', inputs['paper'][version]['path'],
                  '--core', inputs['core']['path'],
                  '--addon', str(Path('target') / os.environ['OUTPUT_NAME']),
                  '--work-dir', str(Path('.native-backpacks') / version),
                  '--java', str(Path(os.environ['JAVA_HOME']) / 'bin/java'),
                  '--expect', 'fixed',
              ], check=True)
          PY
      - name: Upload native backpack regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-backpack-transfer-reports
          path: |
            .native-inputs/inputs.json
            .native-backpacks/*/evidence/*
          include-hidden-files: true
          if-no-files-found: warn
      - name: Stage and verify versioned JAR
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR="target/${OUTPUT_NAME}"
          test -s "$JAR"
          cp "$JAR" "dist/${OUTPUT_NAME}"
          JAR="dist/${OUTPUT_NAME}"
          unzip -p "$JAR" plugin.yml | grep -Fq "api-version: '1.21.11'"
          javap -verbose -classpath "$JAR" io.ncbpfluffybear.fluffymachines.FluffyMachines | grep -Fq 'major version: 65'
          SHA256="$(sha256sum "$JAR" | cut -d' ' -f1)"
          python3 scripts/immutable_release_guard.py --jar "$JAR" --version "$LEGACY_ARTIFACT_VERSION" --sha256 "$SHA256"
          echo "jar_sha256=$SHA256" >> "$GITHUB_OUTPUT"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error

  raw-artifact-preflight:
    name: Verify same-run raw plugin transfer
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist
          skip-decompress: true
      - name: Reject missing, wrapped, wrong-version or changed payloads
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.jar_sha256 }}
        run: python3 scripts/immutable_release_guard.py --jar "dist/$OUTPUT_NAME" --version "$LEGACY_ARTIFACT_VERSION" --sha256 "$EXPECTED_SHA256"

  publish:
    name: Publish explicitly confirmed NEW immutable release
    needs: [build, raw-artifact-preflight]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.publish_release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist
          skip-decompress: true
      - name: Validate request, create a new tag/release, and verify published bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENABLED: ${{ inputs.publish_release }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
          EXPECTED_SHA256: ${{ needs.build.outputs.jar_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
          export CURRENT_MAIN
          python3 - <<'PY'
          import os
          from scripts.immutable_release_guard import validate_request
          validate_request(os.environ['GITHUB_EVENT_NAME'], os.environ['GITHUB_REF'],
                           os.environ['RELEASE_ENABLED'], os.environ['REQUESTED_VERSION'],
                           os.environ['LEGACY_ARTIFACT_VERSION'], os.environ['GITHUB_SHA'],
                           os.environ['CURRENT_MAIN'])
          PY
          TAG="v${REQUESTED_VERSION}"
          JAR="dist/${OUTPUT_NAME}"
          python3 scripts/immutable_release_guard.py --jar "$JAR" --version "$REQUESTED_VERSION" --sha256 "$EXPECTED_SHA256"
          check_endpoint_absent() {
            if gh api "$1" > "$RUNNER_TEMP/release-probe.json" 2> "$RUNNER_TEMP/release-probe.err"; then
              echo "Refusing existing tag or release: $1" >&2
              return 1
            fi
            if ! grep -Fq 'HTTP 404' "$RUNNER_TEMP/release-probe.err"; then
              cat "$RUNNER_TEMP/release-probe.err" >&2
              return 1
            fi
          }
          check_endpoint_absent "repos/$GITHUB_REPOSITORY/releases/tags/$TAG"
          check_endpoint_absent "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG"
          # Atomic ref creation rejects a concurrent tag instead of reusing or overwriting it.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" > "$RUNNER_TEMP/created-tag.json"
          gh release create "$TAG" "$JAR" --verify-tag \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SF_FluffyMachines $TAG" \
            --notes "Verified FluffyMachines $REQUESTED_VERSION from source $GITHUB_SHA; Java 21 artifact, supported API compilation and native backpack restart checks passed."
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/published-verification"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$OUTPUT_NAME" --dir "$RUNNER_TEMP/published-verification"
          python3 scripts/immutable_release_guard.py \
            --jar "$RUNNER_TEMP/published-verification/$OUTPUT_NAME" \
            --version "$REQUESTED_VERSION" --sha256 "$EXPECTED_SHA256"
