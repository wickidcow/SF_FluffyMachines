name: Build FluffyMachines Legacy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  LEGACY_ARTIFACT_VERSION: "26.2.9"
  OUTPUT_NAME: "SF_FluffyMachines26.2.9.jar"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FluffyMachines
        uses: actions/checkout@v6

      - name: Checkout Slimefun Legacy
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: .deps/Slimefun-Legacy

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Publish Slimefun Legacy API locally
        working-directory: .deps/Slimefun-Legacy
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=ALBION-SNAPSHOT --no-daemon

      - name: Build and verify against Slimefun Legacy
        run: >-
          mvn -B clean verify --file pom.xml
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version=ALBION-SNAPSHOT

      - name: Stage versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t jars < <(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          test "${#jars[@]}" -eq 1
          cp "${jars[0]}" "dist/${OUTPUT_NAME}"
          test -s "dist/${OUTPUT_NAME}"
          jar tf "dist/${OUTPUT_NAME}" | grep -Fxq 'plugin.yml'
          sha256sum "dist/${OUTPUT_NAME}"

      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error

      - name: Publish raw JAR release asset
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${LEGACY_ARTIFACT_VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "SF_FluffyMachines $TAG" --notes "Performance update for Slimefun Legacy: auto-crafters now cache recipe identity instead of rescanning the full recipe registry every active tick, and Fluffy Barrel item displays avoid repeated entity lookups and nearby-entity scans when unchanged. Validated against Paper 26.2 / Java 25 and Slimefun Legacy."
          fi
