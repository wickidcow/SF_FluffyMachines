name: FluffyMachines
author: NCBPFluffyBear
description: English maintenance build of FluffyMachines for Minecraft 1.21.11, 26.2 and 26.3 with Slimefun-compatible cores
main: io.ncbpfluffybear.fluffymachines.FluffyMachines

depend: [Slimefun]
softdepend: [mcMMO, NoCheatPlus]

version: ${project.version}
api-version: '1.21.11'

commands:
  fluffymachines:
    description: FluffyMachines command
    usage: /<command>
    aliases: [fm]
permissions:
  fluffymachines.admin:
    description: Allows use of FluffyMachines administrative commands
